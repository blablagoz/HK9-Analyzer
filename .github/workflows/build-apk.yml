name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
      - 'tests/**'
      - 'scripts/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v7
      - name: Verify Android project is present
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::Android project sources are missing. Upload the HK9 Analyzer project, including the Gradle wrapper, to the repository root."
            exit 1
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test protocol framing
        run: |
          mkdir -p build/decoder-test
          javac -d build/decoder-test app/src/main/java/com/blablagoz/hk9analyzer/PacketDecoder.java tests/PacketDecoderTest.java
          java -cp build/decoder-test PacketDecoderTest
      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: HK9-Analyzer-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
      - name: Enable emulator acceleration
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native screens on Android 35
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash scripts/ui-smoke.sh
      - name: Upload screen previews
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: HK9-Companion-screen-previews
          path: build/screenshots/
          if-no-files-found: warn
