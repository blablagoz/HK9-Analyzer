name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v7
      - name: Verify Android project is present
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::Android project sources are missing. Upload the HK9 Analyzer project, including the Gradle wrapper, to the repository root."
            exit 1
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: HK9-Analyzer-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
